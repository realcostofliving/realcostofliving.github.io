name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly data refresh: Mondays 05:17 UTC
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate committed data snapshot
        run: npm run data:validate

      # Scheduled and manual runs pull fresh data from the official APIs. The fresh data are
      # published only if every integrity check passes; otherwise the committed snapshot is used.
      - name: Refresh data from official sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cp public/data/data.json "$RUNNER_TEMP/data.committed.json"
          if npm run data:fetch && npm run data:validate; then
            echo "::notice::Fresh data passed all checks and will be published."
          else
            echo "::warning::Data refresh failed or did not pass validation. Publishing the committed snapshot instead."
            cp "$RUNNER_TEMP/data.committed.json" public/data/data.json
          fi

      - name: Type-check and build
        run: npm run build
        env:
          # A repository named <owner>.github.io is served from the root of that address;
          # any other name is served from /<repository name>/.
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
